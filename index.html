    <!-- Fija el tema antes del primer pintado para evitar el "flash" de color. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('portfolio-theme')
          var theme = stored === 'light' || stored === 'dark' ? stored : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          document.documentElement.dataset.theme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'light' ? '#f7f5f0' : '#080808')
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
